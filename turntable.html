<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Turntable — Figur von allen Seiten</title>
<style>
  body{margin:0;background:#0B1620;color:#F2EDE3;font:13px system-ui,sans-serif}
  h1{font-size:14px;font-weight:500;padding:14px 16px 0;margin:0;color:rgba(242,237,227,.6)}
  .row{display:flex;flex-wrap:wrap;gap:2px;padding:10px 16px 20px}
  figure{margin:0}
  figcaption{text-align:center;padding-top:4px;color:rgba(242,237,227,.45);font-variant-numeric:tabular-nums}
  canvas{display:block;background:#0e1d24;border-radius:4px}
  .controls{padding:0 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  select,input{background:#16262d;color:inherit;border:1px solid rgba(242,237,227,.2);border-radius:6px;padding:5px 8px;font:inherit}
</style>
</head>
<body>
<h1>Turntable — kann man vorne von hinten unterscheiden?</h1>
<div class="controls">
  <label>Übung <select id="move"></select></label>
  <label>Moment im Rep <input id="t" type="range" min="0" max="100" value="0"></label>
  <span id="tv">0.00</span>
</div>
<div class="row" id="row"></div>
<script type="module" src="/src/dev/turntable.ts"></script>
</body>
</html>
