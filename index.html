<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1620">
<meta name="description" content="Angeleitete Morgenroutine mit getaktetem Zählen, Sprachansagen und einer 3D-Figur, die jede Übung vormacht.">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="./favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flow">
<title>Morgen-Flow</title>
</head>
<body>
<div id="progress"></div>

<section id="home" class="screen on">
  <div class="wrap">
    <h1 id="homeTitle"></h1>
    <p class="lede" id="homeLede"></p>
    <ul class="moves" id="moveList"></ul>
    <div class="actions">
      <div class="pace" id="pace" role="group" aria-label="Tempo"></div>
      <button class="btn ghost" id="installBtn" hidden>Auf diesem Gerät installieren</button>
      <button class="btn ghost" id="learnBtn">Übungen vorher ansehen</button>
      <button class="btn primary" id="startBtn">Flow starten</button>
      <div class="opts">
        <label><input type="checkbox" id="voiceOn" checked> Stimme</label>
        <label><input type="checkbox" id="clickOn" checked> Taktklick</label>
      </div>
    </div>
  </div>
</section>

<section id="learn" class="screen">
  <div class="wrap">
    <div class="step-top"><span id="learnPos"></span><button id="learnExit">Schließen</button></div>
    <div class="learn-body">
      <h2 id="learnName"></h2>
      <div id="learnStage"></div>
      <p class="why" id="learnWhy"></p>
      <div class="cues" id="learnCues"></div>
      <p class="dose" id="learnDose"></p>
    </div>
    <div class="row">
      <button class="btn ghost" id="learnPrev">Zurück</button>
      <button class="btn primary" id="learnNext">Weiter</button>
    </div>
  </div>
</section>

<section id="train" class="screen">
  <div class="wrap">
    <div class="tt"><span id="ttLeft"></span><span id="ttRight"></span></div>
    <div class="stage">
      <div class="phase" id="phase"></div>
      <div id="moveName"></div>
      <div id="trainStage"></div>
      <div class="cnt"><span id="count"></span><span id="target"></span></div>
      <div id="sub"></div>
    </div>
    <div>
      <div class="controls">
        <button class="ctl" id="prevBtn" aria-label="Vorherige Übung"><svg viewBox="0 0 24 24"><path d="M7 6h2v12H7zm10 0v12l-8-6z"/></svg></button>
        <button class="ctl big" id="playBtn" aria-label="Pause"><svg id="playIcon" viewBox="0 0 24 24"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg></button>
        <button class="ctl" id="nextBtn" aria-label="Nächste Übung"><svg viewBox="0 0 24 24"><path d="M15 6h2v12h-2zM7 6l8 6-8 6z"/></svg></button>
      </div>
      <button id="endBtn">Einheit beenden</button>
    </div>
  </div>
</section>

<section id="done" class="screen">
  <div class="wrap">
    <h2 id="doneTitle">Fertig.</h2>
    <p class="lede" style="margin-inline:auto;text-align:center" id="doneLine"></p>
    <div class="actions" style="margin-top:28px">
      <button class="btn primary" id="againBtn">Nochmal starten</button>
      <button class="btn ghost" id="homeBtn">Zurück zum Start</button>
    </div>
  </div>
</section>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
