<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flows — morning &amp; hips</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --sky-top:#0B1620; --sky-bottom:#122A2C;
  --bone:#F2EDE3; --bone-dim:rgba(242,237,227,.62); --bone-faint:rgba(242,237,227,.28);
  --gold:#D8B15C; --sage:#8FB3A6; --line:rgba(242,237,227,.16);
  --serif:"Fraunces",Georgia,serif; --sans:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);color:var(--bone);
  background:linear-gradient(170deg,var(--sky-top) 0%,var(--sky-bottom) 100%);
  transition:background 1.6s linear;-webkit-font-smoothing:antialiased;overflow:hidden}
#progress{position:fixed;top:0;left:0;height:2px;width:0;background:var(--gold);z-index:20;transition:width .2s linear}
.screen{position:fixed;inset:0;display:none;flex-direction:column;
  padding:max(22px,env(safe-area-inset-top)) 22px max(22px,env(safe-area-inset-bottom));overflow-y:auto}
.screen.on{display:flex}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:2px}
.wrap{max-width:34rem;width:100%;margin:0 auto;display:flex;flex-direction:column;flex:1}
h1{font-family:var(--serif);font-weight:300;font-size:clamp(2.5rem,10vw,3.8rem);line-height:1;letter-spacing:-.02em}
h1 em{font-style:italic;font-weight:500}
.picker{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.pill{padding:9px 16px;border-radius:999px;border:1px solid var(--line);color:var(--bone-faint);font-size:.85rem;font-weight:500}
.pill.sel{border-color:var(--gold);color:var(--gold)}
.lede{margin-top:14px;color:var(--bone-dim);max-width:30rem;line-height:1.55;font-size:.96rem}
.moves{margin:24px 0 6px;border-top:1px solid var(--line)}
.moves li{list-style:none;display:flex;gap:14px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);font-size:.94rem}
.moves .n{font-family:var(--serif);color:var(--gold);font-size:.85rem;width:1.4rem;flex:none}
.moves .d{margin-left:auto;color:var(--bone-faint);font-size:.8rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.actions{margin-top:auto;padding-top:24px;display:flex;flex-direction:column;gap:10px}
.btn{display:block;width:100%;text-align:center;padding:16px;border-radius:999px;font-weight:600;font-size:1rem}
.btn.primary{background:var(--gold);color:#16202A}
.btn.ghost{border:1px solid var(--line);color:var(--bone-dim)}
.opts{display:flex;justify-content:center;gap:22px;padding-top:16px;color:var(--bone-faint);font-size:.85rem;flex-wrap:wrap}
.opts label{display:flex;align-items:center;gap:8px}
.opts input{accent-color:var(--gold);width:16px;height:16px}
.step-top{display:flex;justify-content:space-between;align-items:center;color:var(--bone-faint);font-size:.82rem}
.learn-body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:28px 0}
.learn-body h2{font-family:var(--serif);font-weight:300;font-size:clamp(1.9rem,8vw,2.9rem);line-height:1.05;letter-spacing:-.02em}
.why{margin-top:16px;color:var(--sage);line-height:1.6;font-size:1rem;max-width:30rem}
.cues{margin-top:22px;display:flex;flex-direction:column;gap:12px;max-width:30rem}
.cues div{display:flex;gap:12px;line-height:1.5;color:var(--bone-dim);font-size:.95rem}
.cues span{color:var(--gold);flex:none}
.dose{margin-top:24px;font-family:var(--serif);font-size:1.05rem}
.row{display:flex;gap:10px}
.row .btn{flex:1}
#train .wrap{justify-content:space-between;text-align:center}
.tt{display:flex;justify-content:space-between;color:var(--bone-faint);font-size:.82rem;font-variant-numeric:tabular-nums}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:0}
.phase{color:var(--sage);font-size:.85rem;letter-spacing:.14em}
#moveName{font-family:var(--serif);font-weight:300;font-size:clamp(1.8rem,7.5vw,2.6rem);line-height:1.1;letter-spacing:-.02em;max-width:16ch}
#trainStage{width:100%;height:min(40vh,300px);min-height:170px;flex:none}
#learnStage{width:100%;height:225px;margin:10px 0 4px}
.cnt{display:flex;align-items:baseline;justify-content:center;gap:12px}
#count{font-family:var(--serif);font-weight:500;font-variant-numeric:tabular-nums;
  font-size:clamp(3rem,15vw,4.6rem);line-height:1;color:var(--gold);display:inline-block}
#count.beat{animation:beat .4s ease-out}
@keyframes beat{0%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:.93}}
#target{color:var(--bone-faint);font-size:.9rem;font-variant-numeric:tabular-nums;letter-spacing:.04em}
#sub{color:var(--bone-dim);font-size:1rem;min-height:1.4em;max-width:26ch;line-height:1.4;margin-top:8px}
.controls{display:flex;align-items:center;justify-content:center;gap:12px;padding-top:16px}
.ctl{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--bone-dim)}
.ctl.big{width:70px;height:70px;background:rgba(242,237,227,.07);color:var(--bone)}
.ctl svg{width:20px;height:20px;fill:currentColor}
.ctl.big svg{width:26px;height:26px}
#endBtn{display:block;margin:14px auto 0;color:var(--bone-faint);font-size:.85rem;text-decoration:underline;text-underline-offset:4px}
#done .wrap{justify-content:center;text-align:center;gap:14px}
#done h2{font-family:var(--serif);font-weight:300;font-size:clamp(2.3rem,9vw,3.2rem)}
@media (prefers-reduced-motion:reduce){body{transition:none}#count.beat{animation:none}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="progress"></div>

<section id="home" class="screen on">
  <div class="wrap">
    <div class="picker" id="picker"></div>
    <h1 id="homeTitle"></h1>
    <p class="lede" id="homeLede"></p>
    <ul class="moves" id="moveList"></ul>
    <div class="actions">
      <button class="btn ghost" id="learnBtn">Learn the moves first</button>
      <button class="btn primary" id="startBtn">Start the flow</button>
      <div class="opts">
        <label><input type="checkbox" id="voiceOn" checked> Voice</label>
        <label><input type="checkbox" id="clickOn" checked> Pace click</label>
      </div>
    </div>
  </div>
</section>

<section id="learn" class="screen">
  <div class="wrap">
    <div class="step-top"><span id="learnPos"></span><button id="learnExit">Close</button></div>
    <div class="learn-body">
      <h2 id="learnName"></h2>
      <div id="learnStage"></div>
      <p class="why" id="learnWhy"></p>
      <div class="cues" id="learnCues"></div>
      <p class="dose" id="learnDose"></p>
    </div>
    <div class="row">
      <button class="btn ghost" id="learnPrev">Back</button>
      <button class="btn primary" id="learnNext">Next</button>
    </div>
  </div>
</section>

<section id="train" class="screen">
  <div class="wrap">
    <div class="tt"><span id="ttLeft"></span><span id="ttRight"></span></div>
    <div class="stage">
      <div class="phase" id="phase"></div>
      <div id="moveName"></div>
      <div id="trainStage"></div>
      <div class="cnt"><span id="count"></span><span id="target"></span></div>
      <div id="sub"></div>
    </div>
    <div>
      <div class="controls">
        <button class="ctl" id="prevBtn" aria-label="Previous move"><svg viewBox="0 0 24 24"><path d="M7 6h2v12H7zm10 0v12l-8-6z"/></svg></button>
        <button class="ctl big" id="playBtn" aria-label="Pause"><svg id="playIcon" viewBox="0 0 24 24"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg></button>
        <button class="ctl" id="nextBtn" aria-label="Next move"><svg viewBox="0 0 24 24"><path d="M15 6h2v12h-2zM7 6l8 6-8 6z"/></svg></button>
      </div>
      <button id="endBtn">End session</button>
    </div>
  </div>
</section>

<section id="done" class="screen">
  <div class="wrap">
    <h2 id="doneTitle">Done.</h2>
    <p class="lede" style="margin-inline:auto;text-align:center" id="doneLine"></p>
    <div class="actions" style="margin-top:28px">
      <button class="btn primary" id="againBtn">Run it again</button>
      <button class="btn ghost" id="homeBtn">Back to start</button>
    </div>
  </div>
</section>

<script>
/* ============ 3D demonstrator ============ */
const Fig = (function(){
  const BONE=0xEBE3D4, JOINT=0xD8B15C, SKIN=0xDCD2C0;
  let renderer, scene, cam, carrier, root, P={}, host=null, live=false;
  let camPos=new THREE.Vector3(2.4,1.6,3.4), camAim=new THREE.Vector3(0,0.95,0);
  let camPosG=camPos.clone(), camAimG=camAim.clone();
  let anim="bounces", side=1, provider=null;

  function seg(len,r,color){
    const g=new THREE.Group();
    const mat=new THREE.MeshStandardMaterial({color:color||BONE,roughness:.8,metalness:.02});
    const m=new THREE.Mesh(new THREE.CylinderGeometry(r*.82,r,len,14),mat);
    m.position.y=-len/2; g.add(m);
    const j=new THREE.Mesh(new THREE.SphereGeometry(r*1.12,14,12),
      new THREE.MeshStandardMaterial({color:JOINT,roughness:.55,metalness:.15}));
    g.add(j);
    const end=new THREE.Object3D(); end.position.y=-len; g.add(end);
    g.userData.end=end; return g;
  }
  function node(x,y,z){ const o=new THREE.Object3D(); o.position.set(x,y,z); return o; }

  function build(){
    scene=new THREE.Scene();
    scene.add(new THREE.HemisphereLight(0xA9C6BE,0x141F26,.85));
    const key=new THREE.DirectionalLight(0xFFE9C0,1.15); key.position.set(3,5,4); scene.add(key);
    const rim=new THREE.DirectionalLight(0x8FB3A6,.5); rim.position.set(-4,2,-3); scene.add(rim);

    const floor=new THREE.Mesh(new THREE.CircleGeometry(2.6,48),
      new THREE.MeshStandardMaterial({color:0x1A2B31,roughness:1,transparent:true,opacity:.85}));
    floor.rotation.x=-Math.PI/2; floor.position.y=0.001; scene.add(floor);

    carrier=new THREE.Object3D(); scene.add(carrier);
    root=node(0,0,0); carrier.add(root);

    // torso
    P.pelvis=new THREE.Mesh(new THREE.SphereGeometry(.13,16,12),
      new THREE.MeshStandardMaterial({color:SKIN,roughness:.85}));
    P.pelvis.scale.set(1.25,.8,.9); root.add(P.pelvis);

    P.spine=node(0,.05,0); root.add(P.spine);
    const sMesh=new THREE.Mesh(new THREE.CylinderGeometry(.115,.135,.24,14),
      new THREE.MeshStandardMaterial({color:SKIN,roughness:.85}));
    sMesh.position.y=.12; sMesh.scale.z=.78; P.spine.add(sMesh);

    P.chest=node(0,.26,0); P.spine.add(P.chest);
    const cMesh=new THREE.Mesh(new THREE.CylinderGeometry(.155,.12,.26,14),
      new THREE.MeshStandardMaterial({color:SKIN,roughness:.85}));
    cMesh.position.y=.13; cMesh.scale.z=.72; P.chest.add(cMesh);

    P.neck=node(0,.28,0); P.chest.add(P.neck);
    const head=new THREE.Mesh(new THREE.SphereGeometry(.115,18,14),
      new THREE.MeshStandardMaterial({color:SKIN,roughness:.8}));
    head.position.y=.11; head.scale.set(.92,1.12,1); P.neck.add(head);

    // arms  (L at +X)
    [["L",1],["R",-1]].forEach(([k,s])=>{
      const sh=node(s*.185,.235,0); P.chest.add(sh);
      const up=seg(.29,.052); sh.add(up); P["arm"+k]=up;
      const fo=seg(.27,.045); up.userData.end.add(fo); P["elb"+k]=fo;
      const hand=new THREE.Mesh(new THREE.SphereGeometry(.055,12,10),
        new THREE.MeshStandardMaterial({color:SKIN,roughness:.85}));
      hand.scale.set(.8,1.1,.55); fo.userData.end.add(hand);
      P["hand"+k]=hand;
      // legs
      const hp=node(s*.105,-.06,0); root.add(hp);
      const th=seg(.44,.075); hp.add(th); P["hip"+k]=th;
      const sn=seg(.42,.058); th.userData.end.add(sn); P["knee"+k]=sn;
      const ft=new THREE.Mesh(new THREE.BoxGeometry(.09,.05,.19),
        new THREE.MeshStandardMaterial({color:SKIN,roughness:.9}));
      ft.position.set(0,-.025,.055); sn.userData.end.add(ft); P["foot"+k]=ft;
    });
  }

  /* ---------- pose ---------- */
  const DEF={ x:0,y:.95,z:0, yaw:0,pitch:0,roll:0,
    spine:[0,0,0], chest:[0,0,0], neck:[0,0,0],
    armL:[0,0,0], armR:[0,0,0], elbL:0, elbR:0,
    hipL:[0,0,0], hipR:[0,0,0], kneeL:0, kneeR:0, footL:0, footR:0 };

  function apply(p){
    const q=Object.assign({},DEF,p);
    carrier.position.set(q.x,q.y,q.z);
    carrier.rotation.set(0,q.yaw,0);
    root.rotation.set(q.pitch,0,q.roll);
    P.spine.rotation.set(...q.spine);
    P.chest.rotation.set(...q.chest);
    P.neck.rotation.set(...q.neck);
    // right side mirrors y/z
    P.armL.rotation.set(q.armL[0],q.armL[1],q.armL[2]);
    P.armR.rotation.set(q.armR[0],-q.armR[1],-q.armR[2]);
    P.elbL.rotation.set(q.elbL,0,0);
    P.elbR.rotation.set(q.elbR,0,0);
    P.hipL.rotation.set(q.hipL[0],q.hipL[1],q.hipL[2]);
    P.hipR.rotation.set(q.hipR[0],-q.hipR[1],-q.hipR[2]);
    P.kneeL.rotation.set(q.kneeL,0,0);
    P.kneeR.rotation.set(q.kneeR,0,0);
  }

  const PI=Math.PI, sin=Math.sin, cos=Math.cos;
  const ss=u=>u<=0?0:u>=1?1:u*u*(3-2*u);           // smoothstep
  const tri=p=>cos(PI*p);                           // +1 → -1 over one rep
  const bell=p=>(1-cos(2*PI*p))/2;                  // 0 → 1 → 0

  /* ---------- animations ---------- */
  const A={
  bounces(p){
    const b=Math.abs(sin(PI*p)), sw=tri(p);
    return { y:.95-.085*b, roll:sw*.10, yaw:sw*.22, x:sw*.035,
      hipL:[-.30*b,0,0], hipR:[-.30*b,0,0], kneeL:.55*b, kneeR:.55*b,
      spine:[.05*b,0,-sw*.05], chest:[0,sw*.12,0],
      armL:[-1.0,.2,.30], armR:[-1.0,.2,.30], elbL:1.5, elbR:1.5 };
  },
  waves(p){
    if(p<.45){ const u=ss(p/.45);
      return { y:.93+.05*u, spine:[-.22*u,0,0], chest:[-.18*u,0,0], neck:[-.15*u,0,0],
        armL:[-3.05*u,0,.28-.12*u], armR:[-3.05*u,0,.28-.12*u], elbL:.25*(1-u), elbR:.25*(1-u),
        hipL:[-.10*u,0,0], hipR:[-.10*u,0,0], kneeL:.18*(1-u), kneeR:.18*(1-u) }; }
    const d=ss((p-.45)/.55);
    return { y:.93-.16*d, spine:[-.22+1.25*d,0,0], chest:[-.18+.55*d,0,0], neck:[-.15+.35*d,0,0],
      armL:[-3.05+3.2*d,0,.16], armR:[-3.05+3.2*d,0,.16], elbL:.3*d, elbR:.3*d,
      hipL:[-.10+.55*d,0,0], hipR:[-.10+.55*d,0,0], kneeL:.5*d, kneeR:.5*d };
  },
  heart(p){
    const o=(1+cos(2*PI*p))/2;                      // 1 = wide open
    return { spine:[-.10*o+.06*(1-o),0,0], chest:[-.16*o+.14*(1-o),0,0], neck:[-.10*o,0,0],
      armL:[-.10-.55*(1-o), -.55+1.00*o, 1.50-1.15*(1-o)],
      armR:[-.10-.55*(1-o), -.55+1.00*o, 1.50-1.15*(1-o)],
      elbL:.15+1.15*(1-o), elbR:.15+1.15*(1-o),
      hipL:[-.04,0,0], hipR:[-.04,0,0], kneeL:.12, kneeR:.12 };
  },
  side2side(p){
    const t=tri(p);
    return { yaw:.80*t, x:.05*t, roll:-.05*t,
      chest:[0,.30*t,0], neck:[0,.12*t,0],
      armL:[-.10,-.15*t,1.45], armR:[-.10,-.15*t,1.45], elbL:.35, elbR:.35,
      hipL:[-.06,0,0], hipR:[-.06,0,0], kneeL:.20+.12*t, kneeR:.20-.12*t };
  },
  altarms(p){
    const a=(1+cos(2*PI*p))/2;                      // 1 = left up
    return { roll:.10*(2*a-1), spine:[0,0,-.09*(2*a-1)],
      armL:[-3.0*a-.15*(1-a),0,.14], armR:[-3.0*(1-a)-.15*a,0,.14],
      elbL:.12, elbR:.12, hipL:[-.05,0,0], hipR:[-.05,0,0], kneeL:.14, kneeR:.14 };
  },
  zen(p){
    const t=tri(p), l=cos(PI*p-.55);                // arms lag the twist
    return { yaw:.95*t, roll:.05*t,
      chest:[0,.45*t,0], neck:[0,.18*t,0],
      armL:[-1.35-.75*l, -.30*l, .55+.25*l], armR:[-1.35+.75*l, .30*l, .55-.25*l],
      elbL:.95-.35*l, elbR:.95+.35*l,
      hipL:[-.05,0,0], hipR:[-.05,0,0], kneeL:.16, kneeR:.16, y:.94 };
  },
  dead(p){
    const t=tri(p), l=cos(PI*p-.7);
    return { yaw:.62*t, chest:[0,.34*t,0], neck:[0,.14*t,0],
      armL:[-.55*l-.15,-.25*l,.16], armR:[.55*l-.15,.25*l,.16],
      elbL:.55+.35*l, elbR:.55-.35*l,
      hipL:[-.04,0,0], hipR:[-.04,0,0], kneeL:.12, kneeR:.12 };
  },
  hydrant(p,s){
    const q=PI/2, lift=bell(p), W=s>0?"L":"R", O=s>0?"R":"L", o={};
    o.pitch=-q+.05; o.yaw=.25*s; o.y=.62;
    o.spine=[.04,0,0]; o.chest=[.02,0,0]; o.neck=[-.20,0,0];
    o.armL=[q-.05,0,.10]; o.armR=[q-.05,0,.10]; o.elbL=.05; o.elbR=.05;
    o["hip"+O]=[q,0,.03]; o["knee"+O]=-q;
    o["hip"+W]=[q-.08*lift,0,1.20*lift]; o["knee"+W]=-q+.25*lift;
    return o;
  },
  adductor(p,s){
    const q=PI/2, rock=bell(p), W=s>0?"L":"R", O=s>0?"R":"L", o={};
    o.pitch=-q+.55-.50*rock; o.yaw=q-.75; o.y=.60;
    o.spine=[.08,0,0]; o.chest=[.05,0,0]; o.neck=[-.22,0,0];
    o.armL=[q-.45+.40*rock,0,.22]; o.armR=[q-.45+.40*rock,0,.22];
    o.elbL=.10; o.elbR=.10;
    o["hip"+O]=[q-.55+.45*rock,0,.05]; o["knee"+O]=-q-.25;
    o["hip"+W]=[q-.35+.25*rock,0,1.42]; o["knee"+W]=-.04;
    return o;
  },
  cossack(p){
    const t=(1+cos(PI*p))/2, dir=t>.5?1:-1;
    const low=1-Math.abs(2*t-1);
    const W=dir>0?"L":"R", O=dir>0?"R":"L", o={};
    const a=.45+.20*low;                              // stance width
    o.y=.95-.86*(1-cos(a))-.40*low;
    o.x=.16*dir*low; o.roll=-.05*dir*low;
    o.spine=[-.36*low,0,.12*dir*low]; o.chest=[-.10*low,0,0]; o.neck=[.28*low,0,0];
    o.armL=[-1.60-.15*low,0,.30]; o.armR=[-1.60-.15*low,0,.30]; o.elbL=.70; o.elbR=.70;
    o["hip"+W]=[-.30*low,0,a-.30*low]; o["knee"+W]=1.85*low;
    o["hip"+O]=[-.02,0,a+.30*low];
    o["knee"+O]=.02;
    return o;
  },
  ninety(p){
    const t=tri(p), u=.55*t;
    return { y:.30, pitch:.14, yaw:.30*t,
      spine:[-.06,0,0], chest:[-.04,0,0], neck:[-.04,0,0],
      armL:[.80,-.30,.55], armR:[.80,-.30,.55], elbL:.30, elbR:.30,
      hipL:[-1.62, .55+u, .30], kneeL:1.70,
      hipR:[-1.30, -(u-.55), .95], kneeR:1.90 };
  }};

  const CLAMP={ hydrant:"all", adductor:"all", ninety:"all", cossack:"none" };
  const CAM={
    bounces:[[2.3,1.5,3.5],[0,.95,0]], waves:[[2.4,1.5,3.6],[0,.95,0]],
    heart:[[1.4,1.5,3.8],[0,1.05,0]], side2side:[[1.2,1.5,3.9],[0,1.0,0]],
    altarms:[[2.4,1.6,3.4],[0,1.05,0]], zen:[[1.4,1.5,3.9],[0,1.0,0]],
    dead:[[1.6,1.5,3.7],[0,1.0,0]],
    hydrant:[[1.5,1.55,2.7],[0,.45,0]], adductor:[[1.5,1.35,2.9],[-.15,.40,0]],
    cossack:[[.15,1.15,3.7],[0,.62,0]], ninety:[[1.5,1.35,2.7],[0,.33,0]]
  };

  /* ---------- loop ---------- */
  const _box=new THREE.Box3();
  function ground(){
    carrier.updateMatrixWorld(true);
    const md=CLAMP[anim]||"feet";
    if(md==="none") return;
    if(md==="all"){ _box.setFromObject(carrier); }
    else { _box.setFromObject(P.footL); const b2=new THREE.Box3().setFromObject(P.footR); _box.union(b2); }
    carrier.position.y -= _box.min.y;
    carrier.updateMatrixWorld(true);
  }
  function frame(){
    if(!live) return;
    requestAnimationFrame(frame);
    const p = provider ? provider() : (performance.now()/1400)%1;
    const fn = A[anim] || A.bounces;
    try{ apply(fn(((p%1)+1)%1, side)); ground(); }catch(e){}
    camPos.lerp(camPosG,.06); camAim.lerp(camAimG,.06);
    cam.position.copy(camPos); cam.lookAt(camAim);
    renderer.render(scene,cam);
  }
  function resize(){
    if(!host) return;
    const w=host.clientWidth||300, h=host.clientHeight||240;
    renderer.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix();
  }

  return {
    init(){
      if(renderer) return true;
      if(typeof THREE==="undefined") return false;
      renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
      renderer.setPixelRatio(Math.min(devicePixelRatio,2));
      cam=new THREE.PerspectiveCamera(34,1,.1,50);
      build(); apply({});
      return true;
    },
    mount(el){
      if(!renderer && !this.init()) return;
      host=el; el.appendChild(renderer.domElement);
      renderer.domElement.style.display="block";
      renderer.domElement.style.width="100%";
      renderer.domElement.style.height="100%";
      resize();
      if(!live){ live=true; requestAnimationFrame(frame); }
    },
    unmount(){ live=false; if(renderer&&renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement); host=null; },
    set(name,sd){
      if(!A[name]) name="bounces";
      anim=name; side=sd||1;
      const c=CAM[name]||CAM.bounces;
      camPosG.set(c[0][0]*(sd<0?-1:1),c[0][1],c[0][2]); camAimG.set(...c[1]);
      if(!live) return;
    },
    drive(fn){ provider=fn; },
    resize
  };
})();

</script>
<script>
/* =====================================================================
   THE ROUTINE — edit here to change anything.
   reps      : total repetitions
   secPerRep : pace (seconds per rep) — this sets how long the move takes
   sayEvery  : how often the voice calls a number out loud
   ===================================================================== */
const ROUTINES = [
{
 id:"morning", title:"Morning<br><em>Flow</em>", label:"Morning Flow · 750",
 lede:"Seven rhythmic movements, 750 reps, just under eleven minutes. Nothing is forced and nothing is heavy — the point is rhythm and repetition, not effort. Jules Horn's 30-day morning routine.",
 moves:[
  { name:"Body bounces", reps:300, secPerRep:0.39, sayEvery:50, sub:"Hips switch left, right",
    why:"The whole warm-up in one block, and the longest. Springy bouncing from the knees while the hips switch side to side — arms stay soft and low in front.",
    cues:["Feet hip-width, knees soft, bounce from the knees","Heels stay low, barely leaving the floor","Let the hips switch side to side with the bounce","Arms loose in front, shoulders and jaw heavy"] },
  { name:"Body waves", reps:50, secPerRep:1.4, sayEvery:10, sub:"Up on the reach, down on the fold",
    why:"A full-body wave, not just a spinal one. Arms sweep overhead as you open and rise, then the wave rolls back down as you fold forward.",
    cues:["Sweep both arms up overhead, chest opens, hips push forward","Then dive: knees bend, chin drops, spine rolls down","Arms swing down past the legs at the bottom","One rep is one full up-and-down wave"] },
  { name:"Heart opener", reps:50, secPerRep:1.15, sayEvery:10, sub:"Arms wide at shoulder height",
    why:"Arms open wide to shoulder height, chest pulls apart, then closes. This is where the front of the body gets its length back.",
    cues:["Arms out to the sides at shoulder height, thumbs back","Pull the arms wide and back on the inhale","Let them swing across the chest on the exhale","Chin level, no cranking the neck back"] },
  { name:"Side to side switch", reps:50, secPerRep:1.0, sayEvery:10, sub:"Turn with the arms out",
    why:"Rotation with the arms held out at shoulder height, weight switching from foot to foot. One rep is one side.",
    cues:["Arms out to the sides, roughly shoulder height","Turn the whole torso one way, then the other","Weight shifts onto the foot you turn towards","Let the arms trail — they follow the turn, they don't lead it"] },
  { name:"Alternate arms up and down", reps:100, secPerRep:1.3, sayEvery:25, sub:"One arm up, one down",
    why:"One arm reaches straight overhead while the other drops, then they swap. Wakes the shoulders and the whole side chain.",
    cues:["Reach one arm long overhead, the other stays low","Swap on a steady beat, keep it rhythmic","Let the ribs and waist stretch with each reach","One rep is one full swap up and down"] },
  { name:"Zen swing", reps:100, secPerRep:0.85, sayEvery:25, sub:"Whip the arms around",
    why:"Twisting from the waist with the arms whipping around the body, rising towards shoulder and head height. Fast, loose, no muscle.",
    cues:["Turn from the waist, let the arms whip around you","One hand comes up in front, the other swings behind","Heels lift as you turn, knees stay soft","Speed comes from the twist, never from the arms"] },
  { name:"Dead arms", reps:100, secPerRep:1.1, sayEvery:25, sub:"Arms completely limp",
    why:"The finisher. Arms totally dead, twisting side to side, hands landing on the chest and the back.",
    cues:["Turn from the waist, arms hang lifeless","Let the hands slap the chest and the low back","Heels can lift as you turn","Shoulders, neck and jaw stay soft"] }
 ]
},
{
 id:"hips", title:"Hip<br><em>Reset</em>", label:"Hip Reset · 4 moves",
 lede:"Four slow hip openers for outer hip, inner thigh, groin and rotation — about four minutes on the floor. Every rep is deliberately slow. Go to the first resistance, not past it.",
 moves:[
  { name:"Fire hydrant — left", reps:10, secPerRep:3, sayEvery:2, sub:"Lift the knee out to the side",
    why:"Outer hip and glute medius — the muscle that stops working when you sit on it all day. Slow lift, slower return.",
    cues:["All fours, hands under shoulders, knees under hips","Keep the knee bent at 90° and lift it out to the side","Stop at hip height — don't let the ribs or back rotate","Lower under control, two seconds down"] },
  { name:"Fire hydrant — right", reps:10, secPerRep:3, sayEvery:2, sub:"Lift the knee out to the side",
    why:"Same on the other side. The weaker side usually announces itself here.",
    cues:["Weight stays even in both hands","Knee at 90°, lift out and slightly back","Belly stays braced so the spine doesn't twist","Lower slowly, no dropping"] },
  { name:"Adductor rock — left", reps:10, secPerRep:3, sayEvery:2, sub:"Rock back, feel the inner thigh",
    why:"Inner thigh and groin. Rocking beats holding — the tissue gives more to slow movement than to a static stretch.",
    cues:["From all fours, extend the left leg straight out to the side","Foot flat, toes pointing forward, knee straight","Rock the hips back towards the heel, then forward","Chest long, back doesn't round"] },
  { name:"Adductor rock — right", reps:10, secPerRep:3, sayEvery:2, sub:"Rock back, feel the inner thigh",
    why:"Other side. Compare how far back you get — the difference is the point.",
    cues:["Right leg straight out to the side, toes forward","Rock back slowly to the first resistance","Breathe out as you rock back","Never bounce at the end range"] },
  { name:"Cossack squat", reps:10, secPerRep:4, sayEvery:2, sub:"One rep is one side, alternating",
    why:"The deep one: groin, adductors and ankle in one shape. Depth comes over weeks, not today.",
    cues:["Feet wide, toes turned slightly out","Sink onto one leg, the other stays straight with the toes up","Chest tall, heel of the bent leg stays down","Push across to the other side — that is one rep","Hold a chair or the wall if balance is the limit"] },
  { name:"90/90 hip switches", reps:20, secPerRep:3, sayEvery:5, sub:"One rep is one switch · 10 per side",
    why:"Internal and external rotation, the range that disappears first from sitting. This is where the hips click and settle.",
    cues:["Sit with both knees bent at 90°, one leg in front, one to the side","Lower both knees over to the other side under control","Chest stays tall, hands lightly on the floor behind","Lead with the knees, not with a throw of the hips"] }
 ]
}];

let ri = 0;
let ROUTINE = ROUTINES[0].moves;
const TRANSITION = 5;   // seconds between moves
const PREP       = 5;   // countdown before the first move
const ANIM_MAP={
  "Body bounces":["bounces",1], "Body waves":["waves",1], "Heart opener":["heart",1],
  "Side to side switch":["side2side",1], "Alternate arms up and down":["altarms",1],
  "Zen swing":["zen",1], "Dead arms":["dead",1],
  "Fire hydrant — left":["hydrant",1], "Fire hydrant — right":["hydrant",-1],
  "Adductor rock — left":["adductor",1], "Adductor rock — right":["adductor",-1],
  "Cossack squat":["cossack",1], "90/90 hip switches":["ninety",1]
};
let figMode="free", figRate=1.4;
function figPhase(){
  if(figMode==="work"){ const m=queue[qi].move; return (elapsed() % m.secPerRep)/m.secPerRep; }
  return (performance.now()/1000 % figRate)/figRate;
}
function figShow(m){ const a=ANIM_MAP[m.name]||["bounces",1]; Fig.set(a[0],a[1]); }
const $ = id => document.getElementById(id);
const fmt = s => Math.floor(s/60) + ":" + String(Math.floor(s%60)).padStart(2,"0");
const dur = m => Math.round(m.reps * m.secPerRep);
let totalWork = 0, totalReps = 0;
function recount(){
  totalWork = ROUTINE.reduce((a,m)=>a+dur(m),0) + TRANSITION*(ROUTINE.length-1) + PREP;
  totalReps = ROUTINE.reduce((a,m)=>a+m.reps,0);
}

let voiceEnabled = true, clickEnabled = true, actx = null;
function say(text, rate=1){
  if(!voiceEnabled || !("speechSynthesis" in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.rate = rate; u.pitch = .95; u.lang = "en-GB";
  speechSynthesis.speak(u);
}
function unlockSpeech(){
  if("speechSynthesis" in window){ const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); }
}
function tone(strong){
  if(!clickEnabled || !actx) return;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.frequency.value = strong ? 900 : 620;
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(strong ? .3 : .13, t + .004);
  g.gain.exponentialRampToValueAtTime(.0001, t + .07);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + .09);
}
function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on", s.id===id));
  if(id==="train"){ Fig.mount($("trainStage")); }
  else if(id==="learn"){ Fig.mount($("learnStage")); }
  else Fig.unmount();
}
window.addEventListener("resize", ()=> Fig.resize());
Fig.drive(figPhase);

function renderHome(){
  ROUTINE = ROUTINES[ri].moves;
  recount();
  $("picker").innerHTML = ROUTINES.map((r,i)=>
    `<button class="pill${i===ri?" sel":""}" data-i="${i}">${r.label}</button>`).join("");
  $("picker").querySelectorAll(".pill").forEach(b=> b.onclick = ()=>{ ri = +b.dataset.i; renderHome(); });
  $("homeTitle").innerHTML = ROUTINES[ri].title;
  $("homeLede").textContent = ROUTINES[ri].lede;
  $("moveList").innerHTML = ROUTINE.map((m,i)=>
    `<li><span class="n">${i+1}</span><span>${m.name}</span><span class="d">${m.reps} × &nbsp;${fmt(dur(m))}</span></li>`).join("");
}
renderHome();

/* ---------- learn ---------- */
let li = 0;
function renderLearn(){
  const m = ROUTINE[li];
  $("learnPos").textContent = `Move ${li+1} of ${ROUTINE.length}`;
  $("learnName").textContent = m.name;
  $("learnWhy").textContent = m.why;
  $("learnCues").innerHTML = m.cues.map(c=>`<div><span>—</span>${c}</div>`).join("");
  $("learnDose").textContent = `${m.reps} reps at about ${m.secPerRep}s each — ${fmt(dur(m))}.`;
  figMode="free"; figRate=Math.max(m.secPerRep,1.3); figShow(m);
  $("learnPrev").style.visibility = li ? "visible" : "hidden";
  $("learnNext").textContent = li === ROUTINE.length-1 ? "Start the flow" : "Next";
}
$("learnBtn").onclick = ()=>{ li=0; renderLearn(); show("learn"); };
$("learnPrev").onclick = ()=>{ if(li>0){ li--; renderLearn(); } };
$("learnNext").onclick = ()=>{ if(li<ROUTINE.length-1){ li++; renderLearn(); } else beginSession(); };
$("learnExit").onclick = ()=> show("home");

/* ---------- engine ---------- */
let queue=[], qi=0, phaseStart=0, paused=false, pausedAt=0, timer=null, lastRep=0, lastTick=-1, wakeLock=null;

function buildQueue(){
  const q=[];
  ROUTINE.forEach((m,i)=>{
    q.push({kind:"ready", move:m, index:i, seconds: i===0 ? PREP : TRANSITION});
    q.push({kind:"work",  move:m, index:i, seconds: dur(m)});
  });
  return q;
}
async function keepAwake(){ try{ if("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); }catch(e){} }
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState==="visible" && !paused && $("train").classList.contains("on")) keepAwake();
});

function beginSession(){
  voiceEnabled = $("voiceOn").checked;
  clickEnabled = $("clickOn").checked;
  if(clickEnabled && !actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(actx && actx.state === "suspended") actx.resume();
  unlockSpeech(); keepAwake();
  queue = buildQueue(); qi = 0; paused = false;
  $("playIcon").innerHTML = '<path d="M7 5h4v14H7zm6 0h4v14h-4z"/>';
  show("train"); enterPhase();
  clearInterval(timer); timer = setInterval(tick, 60);
}

function enterPhase(){
  const p = queue[qi];
  phaseStart = performance.now(); lastRep = 0; lastTick = -1;
  $("moveName").textContent = p.move.name;
  figShow(p.move);
  figMode = p.kind==="work" ? "work" : "free";
  figRate = Math.max(p.move.secPerRep,1.1);
  $("count").style.animationDuration = Math.min(.4, p.move.secPerRep*.7) + "s";
  if(p.kind === "ready"){
    $("phase").textContent = qi===0 ? "starting" : "next up";
    $("target").textContent = "";
    $("sub").textContent = `${p.move.reps} reps · ${p.move.sub}`;
    say(`${p.move.name}. ${p.move.reps} reps.`);
  }else{
    $("phase").textContent = "";
    $("target").textContent = `of ${p.move.reps}`;
    $("sub").textContent = p.move.sub;
    say("Go");
  }
  paint();
}
const elapsed = ()=> ((paused ? pausedAt : performance.now()) - phaseStart)/1000;
const before  = ()=> queue.slice(0,qi).reduce((a,p)=>a+p.seconds,0);

function paint(){
  const done = before() + Math.min(elapsed(), queue[qi].seconds);
  const r = Math.max(0, Math.min(1, done/totalWork));
  $("progress").style.width = (r*100)+"%";
  $("ttLeft").textContent  = `Move ${queue[qi].index+1} of ${ROUTINE.length}`;
  $("ttRight").textContent = `${fmt(done)} / ${fmt(totalWork)}`;
  const mix=(a,b)=>a.map((v,i)=>Math.round(v+(b[i]-v)*r));
  const top=mix([11,22,32],[58,74,107]), bot=mix([18,42,44],[200,162,78]);
  document.body.style.setProperty("--sky-top",`rgb(${top.join(",")})`);
  document.body.style.setProperty("--sky-bottom",`rgb(${bot.join(",")})`);
}
function beat(n, strong){
  const el = $("count");
  el.textContent = n;
  el.classList.remove("beat"); void el.offsetWidth; el.classList.add("beat");
  tone(strong);
}
function tick(){
  if(paused) return;
  const p = queue[qi], t = elapsed();
  if(p.kind === "ready"){
    const left = Math.ceil(p.seconds - t);
    if(left !== lastTick){
      lastTick = left;
      $("count").textContent = Math.max(left,0);
      if(left<=3 && left>0) say(String(left), 1.2);
    }
  }else{
    const rep = Math.min(p.move.reps, Math.floor(t / p.move.secPerRep) + 1);
    if(rep !== lastRep && t < p.seconds){
      lastRep = rep;
      const call = rep % p.move.sayEvery === 0;
      beat(rep, call || rep === p.move.reps);
      if(call && rep !== p.move.reps) say(String(rep), 1.15);
      if(rep === p.move.reps) say("Last one");
    }
  }
  paint();
  if(t >= p.seconds) step(+1);
}
function step(dir){
  if("speechSynthesis" in window) speechSynthesis.cancel();
  if(dir > 0){
    if(qi+1 >= queue.length) return finish();
    qi++;
  }else{
    const startOfMove = queue.findIndex(x => x.index === queue[qi].index && x.kind === "ready");
    qi = (qi === startOfMove && startOfMove > 0) ? startOfMove - 1 : Math.max(startOfMove, 0);
  }
  enterPhase();
}
function setPaused(v){
  paused = v;
  if(v){ pausedAt = performance.now(); if("speechSynthesis" in window) speechSynthesis.cancel(); }
  else { phaseStart += performance.now() - pausedAt; keepAwake(); }
  $("playIcon").innerHTML = v ? '<path d="M8 5v14l11-7z"/>' : '<path d="M7 5h4v14H7zm6 0h4v14h-4z"/>';
  $("playBtn").setAttribute("aria-label", v ? "Resume" : "Pause");
  $("phase").textContent = v ? "paused" : (queue[qi].kind==="ready" ? (qi===0?"starting":"next up") : "");
}
function finish(){
  clearInterval(timer);
  if(wakeLock){ wakeLock.release().catch(()=>{}); wakeLock = null; }
  say("Done.");
  $("doneTitle").textContent = `${totalReps} done.`;
  $("doneLine").textContent = `${totalReps} reps in ${fmt(totalWork)}. The routine only works if tomorrow looks the same.`;
  show("done");
}

$("startBtn").onclick = beginSession;
$("playBtn").onclick  = ()=> setPaused(!paused);
$("nextBtn").onclick  = ()=>{ if(qi < queue.length-1){ if("speechSynthesis" in window) speechSynthesis.cancel(); qi++; enterPhase(); } else finish(); };
$("prevBtn").onclick  = ()=> step(-1);
$("endBtn").onclick   = ()=>{ clearInterval(timer); if("speechSynthesis" in window) speechSynthesis.cancel(); show("home"); };
$("againBtn").onclick = beginSession;
$("homeBtn").onclick  = ()=> show("home");
$("voiceOn").onchange = e => voiceEnabled = e.target.checked;
$("clickOn").onchange = e => clickEnabled = e.target.checked;
document.addEventListener("keydown", e=>{
  if(!$("train").classList.contains("on")) return;
  if(e.code === "Space"){ e.preventDefault(); setPaused(!paused); }
  if(e.code === "ArrowRight") $("nextBtn").click();
  if(e.code === "ArrowLeft")  $("prevBtn").click();
});
</script>
</body>
